<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%">
  <title>cli-template — CLI development template</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.03"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F59E0B" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="450" fill="#FFFFFF"/>
  <rect width="1200" height="450" fill="url(#bg)"/>
  <rect width="1200" height="450" fill="url(#dots)"/>

  <!-- Border -->
  <rect x="0.5" y="0.5" width="1199" height="449" rx="12" ry="12" fill="none" stroke="#E2E8F0" stroke-width="1"/>

  <!-- Left section: project info -->
  <g transform="translate(80, 100)">
    <!-- Org name -->
    <text x="0" y="0" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', monospace" font-size="18" fill="#64748B" letter-spacing="1">
      trapar-waves
    </text>

    <!-- Repo name -->
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="bold" fill="#F59E0B">
      cli-template
    </text>

    <!-- Description -->
    <text x="0" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#475569">
      CLI development template
    </text>
    <text x="0" y="142" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#475569">
      with tsup + consola + picocolors
    </text>

    <!-- Tech badges -->
    <g transform="translate(0, 170)">
      <rect x="0" y="0" width="110" height="36" rx="18" fill="#F59E0B" opacity="0.12"/>
      <text x="55" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#F59E0B">TypeScript</text>

      <rect x="120" y="0" width="70" height="36" rx="18" fill="#F59E0B" opacity="0.12"/>
      <text x="155" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#F59E0B">tsup</text>

      <rect x="200" y="0" width="90" height="36" rx="18" fill="#F59E0B" opacity="0.12"/>
      <text x="245" y="23" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#F59E0B">Node.js</text>
    </g>
  </g>

  <!-- Right section: feature cards -->
  <g transform="translate(640, 60)">
    <!-- Card 1: tsup -->
    <g transform="translate(0, 0)">
      <rect width="240" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="1" y="1" width="238" height="4" rx="2" fill="#F59E0B"/>
      <text x="24" y="52" font-family="system-ui, sans-serif" font-size="36">⚡</text>
      <text x="68" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">tsup</text>
      <text x="24" y="88" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Fast bundler based on esbuild</text>
      <text x="24" y="112" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">ESM + CommonJS output</text>
    </g>

    <!-- Card 2: TypeScript -->
    <g transform="translate(260, 0)">
      <rect width="240" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="1" y="1" width="238" height="4" rx="2" fill="#F59E0B"/>
      <text x="24" y="52" font-family="system-ui, sans-serif" font-size="36">🔧</text>
      <text x="68" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">TypeScript</text>
      <text x="24" y="88" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Full type safety</text>
      <text x="24" y="112" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Modern ES syntax</text>
    </g>

    <!-- Card 3: Consola -->
    <g transform="translate(0, 170)">
      <rect width="240" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="1" y="1" width="238" height="4" rx="2" fill="#F59E0B"/>
      <text x="24" y="52" font-family="system-ui, sans-serif" font-size="36">📦</text>
      <text x="68" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Consola</text>
      <text x="24" y="88" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Structured logging</text>
      <text x="24" y="112" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Context-aware messages</text>
    </g>

    <!-- Card 4: Fast -->
    <g transform="translate(260, 170)">
      <rect width="240" height="150" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="1" y="1" width="238" height="4" rx="2" fill="#F59E0B"/>
      <text x="24" y="52" font-family="system-ui, sans-serif" font-size="36">🚀</text>
      <text x="68" y="52" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#0F172A">Fast</text>
      <text x="24" y="88" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Rapid CLI development</text>
      <text x="24" y="112" font-family="system-ui, sans-serif" font-size="14" fill="#64748B">Production ready</text>
    </g>
  </g>
</svg>
